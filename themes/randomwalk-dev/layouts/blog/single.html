{{ define "main" }}
<header class="container post-header">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">{{ .Date.Format "January 2, 2006" }} &middot; {{ .ReadingTime }} min read</p>
</header>

<article class="container prose post-body">
  {{ .Content }}
</article>

{{ partial "references.html" . }}
{{ partial "post-nav.html" . }}
{{ partial "giscus.html" . }}
{{ end }}
